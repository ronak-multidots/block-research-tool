<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude Code · Flash Sale Header · responsive</title><style>.flash-sale-header{--fsh-bg:#0b0e18;--fsh-color:#fff;--fsh-muted:hsla(0,0%,100%,.68);--fsh-cta-bg:#f5a623;--fsh-cta-color:#14161f;--fsh-font-serif:georgia,"times new roman",times,serif;--fsh-font-sans:-apple-system,blinkmacsystemfont,"Segoe UI",roboto,helvetica,arial,sans-serif;background:var(--fsh-bg);border-radius:8px;color:var(--fsh-color);container-name:flash-sale-header;container-type:inline-size;font-family:var(--fsh-font-sans);overflow:hidden}.flash-sale-header__inner{display:flex;flex-direction:column}.flash-sale-header__media{align-items:flex-end;background:var(--fsh-bg);display:flex;justify-content:center;min-height:220px;order:-1}.flash-sale-header__image{height:100%;object-fit:cover;object-position:bottom;width:100%}.flash-sale-header__media-placeholder{align-items:center;border:1px dashed hsla(0,0%,100%,.3);border-radius:8px;display:flex;font-size:.875rem;justify-content:center;min-height:160px;opacity:.7;width:100%}.flash-sale-header__content{align-items:flex-start;display:flex;flex-direction:column;gap:.4rem;padding:clamp(1.25rem,4vw,2.5rem)}.flash-sale-header__title{font-family:var(--fsh-font-serif);font-size:clamp(1.5rem,4vw,2.25rem);font-weight:700;line-height:1.15;margin:0}.flash-sale-header__subtitle{font-size:.875rem;font-weight:700;margin:0 0 .5rem}.flash-sale-header__countdown-label-static{font-family:var(--fsh-font-serif);font-size:1.0625rem;font-weight:400;margin:0}.flash-sale-header__countdown{display:flex;gap:1.25rem;margin:.25rem 0 .75rem}.flash-sale-header__countdown.is-expired{opacity:.5}.flash-sale-header__countdown-unit{align-items:flex-start;display:flex;flex-direction:column}.flash-sale-header__countdown-value{font-size:1.375rem;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.2}.flash-sale-header__countdown-label{color:var(--fsh
